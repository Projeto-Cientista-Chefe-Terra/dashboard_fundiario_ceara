[server]
headless              = false
enableCORS            = true
port                  = 5000
address               = "0.0.0.0"
enableXsrfProtection  = false
runOnSave             = true

[theme]
base                     = "light"
primaryColor             = "#B06E2E"
backgroundColor          = "#FFFFFF"
secondaryBackgroundColor = "#FAF5F0"
textColor                = "#000000"
font                     = "sans serif"

[logger]
level = "info"

