# docker-compose.yml para o dashboard fundiário do Ceará e chama o servidor terra

version: "3.9"

services:
  postgres:
    image: docker.io/postgis/postgis:latest
    container_name: terra_postgis
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: ***SENHA_POSTGRES_REMOVIDA***
      POSTGRES_DB: geodata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - terra_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d geodata"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  tgdmserver:
    build:
      context: ../terraGeoDataMiniServer
      dockerfile: Dockerfile
    container_name: terra_geodata_mini_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: ***SENHA_POSTGRES_REMOVIDA***
      POSTGRES_DB: geodata
    ports:
      - "8000:8000"
    networks:
      - terra_network
    restart: unless-stopped

  terradash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terra_dashboard
    depends_on:
      - tgdmserver
    ports:
      - "8501:8501"
    networks:
      - terra_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  terra_network:
    name: terra_network
    external: true
